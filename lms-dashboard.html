<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LMSs Dashboard - GCare Council</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #f2f8ff 0%, #ffffff 100%);
      font-family: Arial, sans-serif;
    }

    .lms-dashboard {
      width: 90%;
      max-width: 600px;
      text-align: center;
      padding: 48px 40px;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 28px 70px rgba(16, 45, 85, 0.14);
    }

    .lms-dashboard h1 {
      color: #082c4c;
      font-size: 2rem;
      margin-bottom: 14px;
    }

    .lms-dashboard p {
      color: #5b6f82;
      font-size: 1rem;
      margin-bottom: 28px;
    }

    .lms-dashboard .back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 28px;
      border-radius: 999px;
      background: linear-gradient(135deg, #0b5fa6 0%, #1387da 100%);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(19, 135, 218, 0.22);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .lms-dashboard .back-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(19, 135, 218, 0.28);
    }
  </style>
</head>
<body>
  <main class="lms-dashboard">
    <h1>LMS Dashboard</h1>
    <p>Welcome to the LMS dashboard.</p>
    <a href="index.html" class="back-link">Back to Home</a>
  </main>
</body>
</html>
